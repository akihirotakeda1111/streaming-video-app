services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streaming_video}
      POSTGRES_USER: ${POSTGRES_USER:-streaming_video}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streaming_video}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-streaming_video} -d ${POSTGRES_DB:-streaming_video}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
