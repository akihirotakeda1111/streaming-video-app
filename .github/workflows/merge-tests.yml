name: Merge tests

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'app/frontend/**'
              - '!app/frontend/e2e/**'
              - '!app/frontend/playwright.config.ts'
              - 'app/contracts/**'
              - 'app/compose.yaml'
              - '.github/workflows/merge-tests.yml'
            api:
              - 'app/backend/api/**'
              - 'app/contracts/**'
              - 'app/compose.yaml'
              - '.github/workflows/merge-tests.yml'
            worker:
              - 'app/backend/worker/**'
              - 'app/contracts/**'
              - 'app/compose.yaml'
              - '.github/workflows/merge-tests.yml'
            e2e:
              - 'app/frontend/e2e/**'
              - 'app/frontend/playwright.config.ts'
              - 'app/frontend/package.json'
              - 'app/frontend/package-lock.json'
              - 'app/compose.yaml'
              - '.github/workflows/merge-tests.yml'

  frontend:
    name: Frontend tests
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build frontend
        run: npm run build

  api:
    name: API tests
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/backend/api/go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

  worker:
    name: Worker tests
    needs: changes
    if: ${{ needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend/worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Download dependencies
        run: cargo fetch --locked

      - name: Run tests
        run: cargo test --workspace --locked

  e2e:
    name: E2E tests
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/backend/api/go.mod
          cache: false

      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Start E2E runtime
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          VIDEO_ENCODING_QUEUE_URL: ${{ vars.VIDEO_ENCODING_QUEUE_URL }}
          VIDEO_INPUT_BUCKET: ${{ vars.VIDEO_INPUT_BUCKET }}
          VIDEO_OUTPUT_BUCKET: ${{ vars.VIDEO_OUTPUT_BUCKET }}
          FRONTEND_ORIGIN: http://localhost:5173
          E2E_API_ACCESS_KEY_ID: ${{ secrets.AWS_E2E_API_ACCESS_KEY_ID }}
          E2E_API_SECRET_ACCESS_KEY: ${{ secrets.AWS_E2E_API_SECRET_ACCESS_KEY }}
          E2E_WORKER_ACCESS_KEY_ID: ${{ secrets.AWS_E2E_WORKER_ACCESS_KEY_ID }}
          E2E_WORKER_SECRET_ACCESS_KEY: ${{ secrets.AWS_E2E_WORKER_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_REGION" ] || [ -z "$VIDEO_ENCODING_QUEUE_URL" ] || [ -z "$VIDEO_INPUT_BUCKET" ] || [ -z "$VIDEO_OUTPUT_BUCKET" ]; then
            echo "AWS_REGION, VIDEO_ENCODING_QUEUE_URL, VIDEO_INPUT_BUCKET, and VIDEO_OUTPUT_BUCKET repository variables are required"
            exit 1
          fi
          if [ -z "$E2E_API_ACCESS_KEY_ID" ] || [ -z "$E2E_API_SECRET_ACCESS_KEY" ]; then
            echo "AWS_E2E_API_ACCESS_KEY_ID and AWS_E2E_API_SECRET_ACCESS_KEY repository secrets are required"
            exit 1
          fi
          if [ -z "$E2E_WORKER_ACCESS_KEY_ID" ] || [ -z "$E2E_WORKER_SECRET_ACCESS_KEY" ]; then
            echo "AWS_E2E_WORKER_ACCESS_KEY_ID and AWS_E2E_WORKER_SECRET_ACCESS_KEY repository secrets are required"
            exit 1
          fi

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          docker compose -f app/compose.yaml up -d postgres
          for attempt in {1..30}; do
            if docker compose -f app/compose.yaml exec -T postgres \
              pg_isready -U streaming_video -d streaming_video; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "PostgreSQL did not become ready"
              exit 1
            fi
            sleep 2
          done

          docker compose -f app/compose.yaml exec -T postgres \
            psql -U streaming_video -d streaming_video -v ON_ERROR_STOP=1 \
            < app/backend/api/internal/persistence/migrations/0001_phase1_schema.up.sql

          (
            cd app/backend/api
            HTTP_ADDR=127.0.0.1:8000 \
            DATABASE_URL='postgres://streaming_video:streaming_video_dev_password@127.0.0.1:5432/streaming_video?sslmode=disable' \
            AWS_ACCESS_KEY_ID="$E2E_API_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$E2E_API_SECRET_ACCESS_KEY" \
            AWS_EC2_METADATA_DISABLED=true \
            OUTPUT_S3_ENDPOINT="https://${VIDEO_OUTPUT_BUCKET}.s3.${AWS_REGION}.amazonaws.com" \
            go run ./cmd/api
          ) > "$RUNNER_TEMP/e2e-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/e2e-api.pid"

          (
            cd app/backend/worker
            DATABASE_URL='postgres://streaming_video:streaming_video_dev_password@127.0.0.1:5432/streaming_video?sslmode=disable' \
            AWS_ACCESS_KEY_ID="$E2E_WORKER_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$E2E_WORKER_SECRET_ACCESS_KEY" \
            AWS_EC2_METADATA_DISABLED=true \
            VIDEO_ENCODING_QUEUE_URL="$VIDEO_ENCODING_QUEUE_URL" \
            FFMPEG_PATH=/usr/bin/ffmpeg \
            TMPDIR="$RUNNER_TEMP/e2e-worker" \
            cargo run --locked --package worker
          ) > "$RUNNER_TEMP/e2e-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/e2e-worker.pid"

          unset E2E_API_ACCESS_KEY_ID E2E_API_SECRET_ACCESS_KEY
          unset E2E_WORKER_ACCESS_KEY_ID E2E_WORKER_SECRET_ACCESS_KEY

          (
            cd app/frontend
            VITE_API_BASE_URL=http://127.0.0.1:8000/api/v1 \
              npm run dev -- --host 0.0.0.0 --port 5173
          ) > "$RUNNER_TEMP/e2e-frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/e2e-frontend.pid"

          wait_for() {
            local name="$1"
            local url="$2"
            local log="$3"
            for attempt in {1..60}; do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready"
            tail -n 100 "$log"
            return 1
          }

          wait_for_worker() {
            for attempt in {1..120}; do
              if grep -q '"message":"worker started"' "$RUNNER_TEMP/e2e-worker.log"; then
                return 0
              fi
              if ! kill -0 "$(cat "$RUNNER_TEMP/e2e-worker.pid")" 2>/dev/null; then
                echo "worker stopped before becoming ready"
                tail -n 100 "$RUNNER_TEMP/e2e-worker.log"
                return 1
              fi
              sleep 2
            done
            echo "worker did not become ready"
            tail -n 100 "$RUNNER_TEMP/e2e-worker.log"
            return 1
          }

          wait_for api http://127.0.0.1:8000/api/v1/health "$RUNNER_TEMP/e2e-api.log"
          wait_for frontend http://localhost:5173/ "$RUNNER_TEMP/e2e-frontend.log"
          wait_for_worker

      - name: Run E2E tests
        working-directory: app/frontend
        env:
          E2E_ENVIRONMENT: disposable
          E2E_FRONTEND_URL: http://localhost:5173
          E2E_API_URL: http://127.0.0.1:8000
          E2E_PROJECT: chromium
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: npm run test:e2e

      - name: Show E2E runtime logs
        if: ${{ failure() }}
        run: |
          tail -n 100 "$RUNNER_TEMP/e2e-api.log" || true
          tail -n 100 "$RUNNER_TEMP/e2e-frontend.log" || true
          tail -n 100 "$RUNNER_TEMP/e2e-worker.log" || true

      - name: Stop E2E runtime
        if: ${{ always() }}
        run: |
          for service in api frontend worker; do
            pid_file="$RUNNER_TEMP/e2e-${service}.pid"
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          docker compose -f app/compose.yaml down --volumes || true
