name: AWS E2E (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: AWS-backed E2E tests
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/backend/api/go.mod
          cache: false

      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Run E2E helper tests
        working-directory: app/frontend
        run: npm run test:e2e:helpers

      - name: Install Chromium and system dependencies
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Start E2E runtime
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          VIDEO_ENCODING_QUEUE_URL: ${{ vars.VIDEO_ENCODING_QUEUE_URL }}
          VIDEO_INPUT_BUCKET: ${{ vars.VIDEO_INPUT_BUCKET }}
          VIDEO_OUTPUT_BUCKET: ${{ vars.VIDEO_OUTPUT_BUCKET }}
          PLAYBACK_BASE_URL: ${{ vars.PLAYBACK_BASE_URL }}
          FRONTEND_ORIGIN: http://localhost:5173
          API_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_E2E_API_ACCESS_KEY_ID }}
          API_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_E2E_API_SECRET_ACCESS_KEY }}
          WORKER_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_E2E_WORKER_ACCESS_KEY_ID }}
          WORKER_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_E2E_WORKER_SECRET_ACCESS_KEY }}
        run: bash app/scripts/start-e2e-compose.sh

      - name: Authenticate E2E runner with AWS OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_E2E_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.E2E_AWS_ACCOUNT_ID }}
          role-session-name: e2e-${{ github.job }}-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true

      - name: Run E2E tests
        working-directory: app/frontend
        env:
          E2E_ENVIRONMENT: disposable
          E2E_FRONTEND_URL: http://localhost:5173
          E2E_API_URL: http://127.0.0.1:8000
          AWS_REGION: ${{ vars.AWS_REGION }}
          E2E_OUTPUT_BUCKET: ${{ vars.VIDEO_OUTPUT_BUCKET }}
          OUTPUT_S3_ENDPOINT: https://${{ vars.VIDEO_OUTPUT_BUCKET }}.s3.${{ vars.AWS_REGION }}.amazonaws.com
          E2E_AWS_ACCOUNT_ID: ${{ vars.E2E_AWS_ACCOUNT_ID }}
          PLAYBACK_BASE_URL: ${{ vars.PLAYBACK_BASE_URL }}
          E2E_PROJECT: chromium
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: npm run test:e2e

      - name: Show E2E runtime logs
        if: ${{ failure() }}
        run: docker compose -f app/compose.yaml logs --no-color --tail 100 || true

      - name: Stop E2E runtime
        if: ${{ always() }}
        run: docker compose -f app/compose.yaml down --volumes --remove-orphans || true
